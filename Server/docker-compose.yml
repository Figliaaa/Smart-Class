services:
  # 1. MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto
    restart: always
    ports:
      - "1883:1883" # MQTT TCP
      - "9001:9001" # MQTT WebSocket
    volumes:
      - ./Mosquitto/Config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 2. Backend Service (Flask API + DB Logger)
  backend:
    build: ./backend
    container_name: iot_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend/database:/app/database
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883

  # 3. Vue 3 Web Dashboard
  web:
    build: ../web
    container_name: iot_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
